services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: coldchain-db
    environment:
      POSTGRES_DB: coldchain
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain_dev_only
    ports:
      - "5432:5432"
    volumes:
      - coldchain_data:/var/lib/postgresql/data
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: coldchain-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
volumes:
  coldchain_data:
